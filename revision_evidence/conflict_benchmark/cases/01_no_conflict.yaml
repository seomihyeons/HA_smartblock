- alias: No conflict hallway motion light
  trigger:
    - platform: state
      entity_id: binary_sensor.hallway_motion
      to: "on"
  action:
    - service: light.turn_on
      target:
        entity_id: light.hallway

- alias: No conflict laundry done notify
  trigger:
    - platform: state
      entity_id: sensor.washer
      to: "done"
  action:
    - service: notify.mobile_app_phone
      data:
        message: "Washer done"
