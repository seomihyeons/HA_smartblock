name: Icon Branch Checks
on:
  push:
    branches: [feature/user-study-icon]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Block vulnerable production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Audit all dependencies (report only)
        run: |
          npm audit --json > audit-all.json || true
          node -e 'const a=require("./audit-all.json"); console.log("All dependencies audit:",JSON.stringify({counts:a.metadata?.vulnerabilities,findings:Object.entries(a.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,range:v.range,fixAvailable:v.fixAvailable,via:v.via?.filter(x=>typeof x==="object").map(x=>({title:x.title,url:x.url}))}))},null,2))'
      - run: npm test
      - run: npm run build
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node test/icon_browser_smoke.cjs
