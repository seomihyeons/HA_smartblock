name: LLM research tests
on:
  push:
    branches: [research/llm-agent]
  pull_request:
    branches: [research/llm-agent]
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: python -m pip install -r ha_llm_control/requirements.txt
      - run: npm test
      - run: python -B -m unittest discover -s ha_llm_control/llm_assistant/tests -v
      - name: Verify cloud transports import without constructing a client
        run: python -B -c "import ha_llm_control.llm_api.chatgpt, ha_llm_control.llm_api.claude, ha_llm_control.llm_api.gemini, ha_llm_control.llm_api.grok"
      - run: npm run build
