name: LLM area registry grounding
on:
  push:
    branches: [feature/llm-tool-orchestration]
  pull_request:
    paths:
      - "server/**"
      - "smartblock_llm/**"
      - "package*.json"
      - ".github/workflows/llm-area-registry.yml"

jobs:
  area-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Backend syntax
        run: |
          node --check server/analyze_server.js
          node --check server/ha_registry_client.mjs
          node --check server/entity_cards.mjs
      - name: Area registry and capability tests (required)
        run: node --test server/tests/ha_registry_client.test.mjs server/tests/capability_registry.test.mjs
      - name: Production webpack build (required)
        run: npm run build
      - name: Existing full regression suite (informational, pre-existing failures)
        run: |
          if npm test; then
            echo "Full legacy npm test suite passed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WARNING: Full legacy npm test suite failed. See logs for unrelated stale tests; this is NOT a green full-regression result." >> "$GITHUB_STEP_SUMMARY"
          fi
