name: Publish HA-SmartBlock Evaluation Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "GHCR Docker tag (for example: study-v3-dev-01)"
        required: true
        type: string

# This is deliberately separate from publish-ha-smartblock.yml.  It publishes
# only an explicitly requested evaluation tag and never updates 0.1.1/latest.
permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and publish ${{ inputs.image_tag }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out the selected evaluation commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validate tag and image name
        id: image
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail

          if ! [[ "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid Docker tag: $IMAGE_TAG" >&2
            exit 1
          fi

          if [ "$IMAGE_TAG" = "0.1.1" ]; then
            echo "Tag 0.1.1 is reserved for the existing production image." >&2
            exit 1
          fi

          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${owner}/ha_smartblock" >> "$GITHUB_OUTPUT"

      - name: Prepare build context from current root sources
        run: |
          set -euo pipefail

          context="$RUNNER_TEMP/ha-smartblock-ghcr-context"
          mkdir -p "$context"

          # Keep add-on packaging/runtime files, but take all application code
          # and build inputs from the repository root at this exact commit.
          cp ha_smartblock/Dockerfile "$context/Dockerfile"
          cp ha_smartblock/run.sh ha_smartblock/config.yaml "$context/"
          cp -a ha_smartblock/server "$context/server"
          cp -a src test "$context/"
          cp package.json package-lock.json webpack.config.js "$context/"

          test -f "$context/Dockerfile"
          test -f "$context/run.sh"
          test -f "$context/server/addon_server.js"
          test -f "$context/src/index.js"
          test -f "$context/test/task_alt/run_task_alt.js"
          test -f "$context/package-lock.json"
          test -f "$context/webpack.config.js"
          test ! -e "$context/ha_smartblock/src"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish multi-architecture image
        uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/ha-smartblock-ghcr-context
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BUILD_VERSION=${{ inputs.image_tag }}
          tags: ${{ steps.image.outputs.name }}:${{ inputs.image_tag }}
